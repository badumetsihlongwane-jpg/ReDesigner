name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run production integrity checks
        run: npm run check

      - name: Run unit and headless Chrome E2E tests
        run: npm test

      - name: Verify release zip packaging
        run: |
          npm run pack
          unzip -l dist/redesigner-v*.zip
